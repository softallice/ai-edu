spring:
  application:
    name: ai-edu-backend

  # 로컬 개발 DB: docker-compose 로 띄운 PostgreSQL (aiedu-postgres 컨테이너).
  #   docker compose up -d  로 먼저 기동한 뒤 애플리케이션을 실행하세요.
  # 주의(교육용): 자격증명을 소스에 하드코딩했습니다. 실제 배포 시에는 환경변수
  #   (SPRING_DATASOURCE_USERNAME/PASSWORD) 나 시크릿 매니저로 외부화하세요.
  datasource:
    url: jdbc:postgresql://localhost:5432/aiedu
    username: ${SPRING_DATASOURCE_USERNAME:aiedu}
    password: ${SPRING_DATASOURCE_PASSWORD:aiedu}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 교육용: 기동 시 스키마를 새로 생성하고 종료 시 삭제해 재현 가능한 상태를 유지합니다.
      # 운영에서는 Flyway/Liquibase 로 스키마를 관리하세요.
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        # PostgreSQL 방언은 드라이버로 자동 감지됩니다.
    open-in-view: false
    # data.sql 시드를 스키마 생성 이후에 실행
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug

# JWT 설정 (HS256). validity-ms 기본 24시간.
app:
  # 주의(교육용): 운영에서는 APP_JWT_SECRET 를 충분히 긴 무작위 값으로 외부 주입하세요.
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-secret-please-change-0123456789abcdef}
    validity-ms: 86400000
