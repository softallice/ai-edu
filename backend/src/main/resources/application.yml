spring:
  application:
    name: ai-edu-backend

  # 교육용 인메모리 DB (H2). 애플리케이션 종료 시 데이터는 사라집니다.
  datasource:
    url: jdbc:h2:mem:aiedu;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      # 시작 시 스키마 자동 생성(교육용). 운영에서는 Flyway/Liquibase 권장.
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    # data.sql 시드를 스키마 생성 이후에 실행
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  # H2 웹 콘솔: http://localhost:8080/h2-console (JDBC URL = jdbc:h2:mem:aiedu)
  h2:
    console:
      enabled: true

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
